<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420"
     role="img" aria-labelledby="t d">
  <title id="t">Zeny: accept every way your customers pay, settle however you like</title>
  <desc id="d">Payment methods flow into the Zen coin and settle as one balance in USD, SGD or IDR.</desc>
  <defs>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#C8F031" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#C8F031" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#F2F3EE" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: 'Space Grotesk', 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .mono { font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .flow { stroke-dasharray: 4 7; animation: dash 1.6s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -22; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style>
  </defs>

  <rect width="1280" height="420" rx="24" fill="#0E0F0C"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="24" fill="url(#glow)"/>

  <!-- Left: pill, headline, lede -->
  <g transform="translate(72 92)">
    <rect width="372" height="30" rx="15" fill="#1A1B17" stroke="#2A2C25"/>
    <rect x="4" y="4" width="134" height="22" rx="11" fill="#C8F031"/>
    <text class="mono" x="71" y="19.5" font-size="11" font-weight="700" fill="#0E0F0C" text-anchor="middle" letter-spacing="1.1">USD · SGD · IDR</text>
    <text class="mono" x="150" y="19.5" font-size="11" font-weight="500" fill="#9A9C93" letter-spacing="1.1">EVERY METHOD · ONE BALANCE</text>

    <text class="sans" y="104" font-size="62" font-weight="600" fill="#F2F3EE" letter-spacing="-3">Accept every way</text>
    <text class="sans" y="170" font-size="62" font-weight="600" fill="#F2F3EE" letter-spacing="-3">people <tspan fill="#C8F031">pay.</tspan></text>
    <text class="sans" y="222" font-size="20" fill="#9A9C93">Cards, QRIS, e-wallets, PayPal and bank transfers,</text>
    <text class="sans" y="250" font-size="20" fill="#9A9C93">landing in one balance with next-day settlement.</text>
  </g>

  <!-- Right: methods flowing into the Zen coin, out to a balance -->
  <g transform="translate(790 70)">
    <g class="mono" font-size="13" font-weight="500" fill="#F2F3EE">
      <rect x="0" y="0"   width="148" height="40" rx="11" fill="#1A1B17" stroke="#2A2C25"/>
      <text x="74" y="25" text-anchor="middle">QRIS</text>
      <rect x="0" y="54"  width="148" height="40" rx="11" fill="#1A1B17" stroke="#C8F031"/>
      <text x="74" y="79" text-anchor="middle">Cards</text>
      <rect x="0" y="108" width="148" height="40" rx="11" fill="#1A1B17" stroke="#2A2C25"/>
      <text x="74" y="133" text-anchor="middle">E-wallets</text>
      <rect x="0" y="162" width="148" height="40" rx="11" fill="#1A1B17" stroke="#2A2C25"/>
      <text x="74" y="187" text-anchor="middle">Virtual account</text>
      <rect x="0" y="216" width="148" height="40" rx="11" fill="#1A1B17" stroke="#2A2C25"/>
      <text x="74" y="241" text-anchor="middle">PayPal</text>
    </g>

    <g fill="none" stroke="#C8F031" stroke-opacity="0.55" stroke-width="1.5">
      <path class="flow" d="M148 20  C200 20  196 140 226 140"/>
      <path class="flow" d="M148 74  C185 74  190 140 226 140"/>
      <path class="flow" d="M148 128 C180 128 200 140 226 140"/>
      <path class="flow" d="M148 182 C185 182 190 140 226 140"/>
      <path class="flow" d="M148 236 C190 236 190 140 226 140"/>
      <path class="flow" d="M290 140 H326"/>
    </g>

    <!-- Zen coin -->
    <circle cx="258" cy="140" r="34" fill="#C8F031"/>
    <path d="M226 130 H270 L257 150 H290" fill="none" stroke="#0E0F0C" stroke-width="5.5" stroke-linejoin="round"/>

    <!-- Balance card -->
    <g transform="translate(326 82)">
      <rect width="104" height="116" rx="14" fill="#1A1B17" stroke="#2A2C25"/>
      <text class="mono" x="14" y="26" font-size="9.5" font-weight="500" fill="#9A9C93" letter-spacing="1">BALANCE</text>
      <text class="mono" x="14" y="56" font-size="17" font-weight="600" fill="#F2F3EE">$12,480</text>
      <text class="mono" x="14" y="76" font-size="10" fill="#C8F031">+ settled</text>
      <text class="mono" x="14" y="98" font-size="10" fill="#9A9C93">D+1</text>
    </g>
  </g>

  <!-- Footer line -->
  <g transform="translate(72 372)">
    <circle cx="9" cy="-4" r="9" fill="#C8F031"/>
    <path d="M0.5 -6.5 H12 L8.4 -1.5 H17.5" fill="none" stroke="#0E0F0C" stroke-width="1.8" stroke-linejoin="round"/>
    <text class="sans" x="28" y="1" font-size="18" font-weight="700" fill="#F2F3EE" letter-spacing="-0.8">zeny</text>
    <text class="mono" x="86" y="0" font-size="12" fill="#9A9C93" letter-spacing="0.6">usezeny.com</text>
  </g>
</svg>
